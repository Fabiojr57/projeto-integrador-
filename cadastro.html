<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Sistema Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Cadastro de Usuário</h2>

    <form id="cadastroForm">
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" required><br><br>

        <label for="emailCadastro">E-mail:</label><br>
        <input type="email" id="emailCadastro" required><br><br>

        <label for="senhaCadastro">Senha:</label><br>
        <input type="password" id="senhaCadastro" required><br><br>

        <button type="submit">Cadastrar</button>
    </form>

    <p id="mensagemCadastro"></p>

    <a href="index.html">Voltar para Login</a>

    <script src="script.js"></script>
</body>
</html>
